name: Publish

# Publishes on every pushed tag like v0.2.0
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # required for npm OIDC trusted publishing
      packages: write      # required for GitHub Packages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      # npm OIDC needs a recent npm; setup-node ships an older one
      - name: Upgrade npm (OIDC support)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # ---- 1) Publish to npmjs.com (unscoped name, OIDC, no token) ----
      - name: Publish to npm
        run: npm publish --provenance --access public

      # ---- 2) Publish to GitHub Packages (scoped name) ----
      - name: Configure for GitHub Packages
        run: |
          npm pkg set name="@bayarcash/n8n-nodes-bayarcash"
          npm config set @bayarcash:registry "https://npm.pkg.github.com"

      - name: Publish to GitHub Packages
        run: npm publish --registry=https://npm.pkg.github.com --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
